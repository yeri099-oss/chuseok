<script>

const C = { users:"holidayApp_users", orders:"holidayApp_orders", menu:"holidayApp_menu", meta:"holidayApp_meta", logs:"holidayApp_logs" };

const DEFAULT_MENU = [
  { id:"m1", sort:1, active:true, name:"자연양돈 완자전 도시락", price:26000, desc:"35g 10개입 / 종이 도시락 포장\nNon GMO 사료로 키운 무항생제 자연양돈 돈육으로 지져낸 동그랑땡" },
  { id:"m2", sort:2, active:true, name:"달맞이 둥근 삼색 송편 1kg", price:22000, desc:"냉동 / 약 20g 50개 내외\n유기농멥쌀(국산), 참깨(국산), 대두(국산), 쑥가루(국산), 단호박가루(국산), 유기농설탕, 천일염(국산)" },

];
const DEFAULT_SETTINGS = {
  bank:"기업은행", account:"02409732104031", holder:"꽃밥이야기",
  deadline:"2026-09-20T20:00", orderOpen:true,
  pickupDates:["2026-09-23","2026-09-24"], timeStart:12, timeEnd:19,
  limitNote:"100세트 한정 선착순 마감 (예약 수량 외 추가 구입 불가)",
  phone:"02-3676-6262 / 02-766-6272",
  notice:"안녕하세요, 꽃밥지기 송정은입니다.\n올해는 내부 사정으로 명절음식 전체 준비는 쉬어가고, 가장 사랑받는 자연양돈 완자전(동그랑땡)과 송편, 식혜만 준비합니다. 실망스러우시더라도 이해 부탁드려요.\n\n예약 접수: 9월 7일(월) ~ 9월 20일(일) 저녁 8시\n100세트 한정 선착순 마감 (올해는 예약 수량 외 추가 구입이 어려우니 꼭 필요하신 수량을 점검해 주세요)\n픽업: 9월 23일(수), 24일(목) 오후 12시 ~ 7시\n택배 불가, 퀵 발송 가능 (퀵비용 별도)\n문의: 02-3676-6262 / 02-766-6272",
  materials:"Non GMO 사료로 키운 무항생제 자연양돈 돈육\n무농약 채소\n무항생제 동물복지 유정란\n무농약 우리밀 / 무농약콩 두부\n국내산 참기름, 들기름\n국내산콩 전통발효간장 / 태안자염\n마스코바도 유기농설탕\n네니아 Non GMO 냉압착 유채유"
};

/* ===================== 데이터 계층 (Firebase / 데모) ===================== */
const DEMO = (location.protocol === "file:" || location.search.includes("demo=1"));
let DB;
if (!DEMO) {
  const app = firebase.initializeApp(FIREBASE_CONFIG, APP_NAME);
  const auth = firebase.auth(app);
  const fs = firebase.firestore(app);
  const conv = d => ({ id:d.id, ...d.data() });
  DB = {
    onAuth: cb => auth.onAuthStateChanged(u => cb(u ? { uid:u.uid, email:u.email, displayName:u.displayName } : null)),
    signUp: async (email,pw,name) => { const r = await auth.createUserWithEmailAndPassword(email,pw); if(name) await r.user.updateProfile({displayName:name}); return { uid:r.user.uid, email }; },
    signIn: async (email,pw) => { const r = await auth.signInWithEmailAndPassword(email,pw); return { uid:r.user.uid, email }; },
    signOut: () => auth.signOut(),
    ts: () => firebase.firestore.FieldValue.serverTimestamp(),
    get: async (col,id) => { const d = await fs.collection(col).doc(id).get(); return d.exists ? conv(d) : null; },
    set: (col,id,data,merge) => fs.collection(col).doc(id).set(data,{merge:!!merge}),
    update: (col,id,data) => fs.collection(col).doc(id).update(data),
    del: (col,id) => fs.collection(col).doc(id).delete(),
    add: async (col,data) => (await fs.collection(col).add(data)).id,
    getAll: async (col,filter) => { let q = fs.collection(col); if(filter) q = q.where(filter.field,filter.op,filter.value); const s = await q.get(); return s.docs.map(conv); },
    listen: (col,filter,cb,err) => { let q = fs.collection(col); if(filter) q = q.where(filter.field,filter.op,filter.value); return q.onSnapshot(s => cb(s.docs.map(conv)), e => { console.error(e); err && err(e); }); }
  };
} else {
  // 데모 모드: 브라우저 메모리에만 저장 (file://로 열었을 때)
  const store = {}; const users = {}; let cur = null; const authCbs = []; const listeners = [];
  const col = c => (store[c] = store[c] || {});
  const fire = c => listeners.filter(l => l.col===c).forEach(l => l.cb(match(c,l.filter)));
  const match = (c,f) => Object.entries(col(c)).map(([id,d]) => ({id,...clone(d)})).filter(d => !f || d[f.field]===f.value);
  const clone = o => JSON.parse(JSON.stringify(o), (k,v) => (v && v.__ts) ? new Date(v.__ts) : v);
  const emitAuth = () => authCbs.forEach(cb => cb(cur));
  DB = {
    onAuth: cb => { authCbs.push(cb); setTimeout(() => cb(cur), 0); },
    signUp: async (email,pw,name) => { if(users[email]) throw {code:"auth/email-already-in-use"}; if(pw.length<6) throw {code:"auth/weak-password"}; users[email] = {pw, uid:"u_"+Math.random().toString(36).slice(2,9), displayName:name}; cur = {uid:users[email].uid,email,displayName:name}; emitAuth(); return cur; },
    signIn: async (email,pw) => { const u = users[email]; if(!u) throw {code:"auth/user-not-found"}; if(u.pw!==pw) throw {code:"auth/wrong-password"}; cur = {uid:u.uid,email,displayName:u.displayName}; emitAuth(); return cur; },
    signOut: async () => { cur = null; emitAuth(); },
    ts: () => ({__ts: Date.now()}),
    get: async (c,id) => col(c)[id] ? {id,...clone(col(c)[id])} : null,
    set: async (c,id,data,merge) => { col(c)[id] = merge ? {...(col(c)[id]||{}),...clone(data)} : clone(data); fire(c); },
    update: async (c,id,data) => { if(!col(c)[id]) throw new Error("no doc"); Object.assign(col(c)[id], clone(data)); fire(c); },
    del: async (c,id) => { delete col(c)[id]; fire(c); },
    add: async (c,data) => { const id = "d_"+Math.random().toString(36).slice(2,10); col(c)[id] = clone(data); fire(c); return id; },
    getAll: async (c,f) => match(c,f),
    listen: (c,f,cb) => { const l = {col:c,filter:f,cb}; listeners.push(l); setTimeout(() => cb(match(c,f)),0); return () => { const i = listeners.indexOf(l); if(i>=0) listeners.splice(i,1); }; }
  };
  window.__DEMO_DB = { store, users };
}

/* ===================== 유틸 ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const won = n => (Number(n)||0).toLocaleString("ko-KR") + "원";
const digits = s => String(s||"").replace(/\D/g,"");
const fmtPhone = p => { p = digits(p); if(p.length===11) return p.replace(/(\d{3})(\d{4})(\d{4})/,"$1-$2-$3"); if(p.length===10) return p.replace(/(\d{2,3})(\d{3,4})(\d{4})/,"$1-$2-$3"); return p; };
const toDate = v => { if(!v) return null; if(v.toDate) return v.toDate(); if(v instanceof Date) return v; if(typeof v==="number"||typeof v==="string") return new Date(v); return null; };
const fmtDT = v => { const d = toDate(v); if(!d) return ""; const z = n => String(n).padStart(2,"0"); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`; };
const DAYS = ["일","월","화","수","목","금","토"];
const fmtPickDate = s => { if(!s) return ""; const d = new Date(s+"T00:00:00"); if(isNaN(d)) return s; return `${d.getMonth()+1}월 ${d.getDate()}일(${DAYS[d.getDay()]})`; };
const timeSlots = st => { const a = []; for(let h = Number(st.timeStart); h < Number(st.timeEnd); h++) a.push(`${h}시~${h+1}시`); return a; };
const phoneToEmail = p => digits(p) + "@" + EMAIL_DOMAIN;
let toastT; const toast = m => { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2200); };
async function copyText(t){ try { await navigator.clipboard.writeText(t); return true; } catch(e){ const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); let ok=false; try{ ok = document.execCommand("copy"); }catch(_){} ta.remove(); return ok; } }
const authMsg = e => { const c = (e && e.code) || ""; if(c.includes("email-already-in-use")) return "이미 가입된 번호입니다. 로그인해 주세요."; if(c.includes("weak-password")) return "비밀번호는 6자리 이상으로 정해 주세요."; if(c.includes("wrong-password")||c.includes("user-not-found")||c.includes("invalid-credential")||c.includes("invalid-login")) return "번호 또는 비밀번호가 맞지 않습니다. 아직 가입 전이라면 회원가입을 눌러주세요."; if(c.includes("too-many-requests")) return "시도가 너무 많습니다. 잠시 후 다시 해주세요."; if(c.includes("network")) return "네트워크 연결을 확인해 주세요."; if(c.includes("permission-denied")) return "권한이 없습니다. (Firestore 규칙 확인 필요)"; return "오류: " + ((e && (e.message||e.code)) || e); };

/* ===================== 모달 ===================== */
function openModal(html, opts={}){
  const root = $("#modalRoot");
  root.innerHTML = `<div class="modal-bg"><div class="modal" role="dialog">${html}</div></div>`;
  if(opts.onOpen) opts.onOpen(root);
  return root;
}
function closeModal(){ $("#modalRoot").innerHTML = ""; }
function confirmModal(title, body, okLabel="확인", danger=false){
  return new Promise(res => {
    openModal(`<h3>${esc(title)}</h3><div>${body}</div><div class="btns"><button class="ghost" id="mCancel">취소</button><button id="mOk" class="${danger?'danger':''}">${esc(okLabel)}</button></div>`);
    $("#mCancel").onclick = () => { closeModal(); res(false); };
    $("#mOk").onclick = () => { closeModal(); res(true); };
  });
}
function accountModal(total, depositor){
  openModal(`<h3>입금 계좌 안내</h3>
    <div class="acct"><div>${esc(S.bank)}</div><div class="num" id="acctNum">${esc(S.account)}</div><div>예금주: ${esc(S.holder)}</div></div>
    ${total ? `<div class="row between" style="margin:6px 0"><span>입금하실 금액</span><b style="font-size:18px;color:var(--tc)">${won(total)}</b></div>` : ""}
    ${depositor ? `<div class="row between" style="margin:6px 0"><span>입금자명</span><b>${esc(depositor)}</b></div>` : ""}
    <div class="emph">입금자명은 예약 시 적어주신 이름과 똑같이 입력해 주세요. 입금자명이 다르면 확인이 늦어질 수 있습니다.</div>
    <div class="btns"><button class="ghost" id="mClose">닫기</button><button id="mCopy">계좌 복사하기</button></div>`);
  $("#mClose").onclick = closeModal;
  $("#mCopy").onclick = async () => { const ok = await copyText(S.account); toast(ok ? "계좌번호가 복사되었습니다" : "복사에 실패했습니다. 번호를 직접 입력해 주세요"); };
}

/* ===================== 상태 ===================== */
let user = null;          // {uid,email,displayName}
let profile = null;       // holidayApp_users 문서
let isAdmin = false;
let S = {...DEFAULT_SETTINGS};   // 설정
let MENU = [];            // 품목
let ORDERS = [];          // 내 주문 또는(관리자) 전체 주문
let LOGS = [];
let USERS = [];
let cart = {};            // {menuId: qty}
let cartForm = { pickupDate:"", pickupTime:"", depositor:"", memo:"" };
let tab = "order";
let unsubs = [];
let authMode = "login";   // login | signup | admin
let adminSort = { key:"createdAt", dir:-1 };
let adminQ = ""; let showCancelled = false; let logQ = "";
let pendingSignup = null;

function log(type, detail){
  const d = { type, uid: user ? user.uid : null, name: isAdmin ? "관리자" : (profile ? profile.name : (pendingSignup?pendingSignup.name:"")), phone: profile ? profile.phone : (pendingSignup?pendingSignup.phone:""), detail: detail||"", at: DB.ts() };
  return DB.add(C.logs, d).catch(e => console.warn("log fail", e));
}
function saveCartLocal(){ try{ if(user) localStorage.setItem("chuseokCart_"+user.uid, JSON.stringify({cart, cartForm})); }catch(e){} }
function loadCartLocal(){ try{ const v = JSON.parse(localStorage.getItem("chuseokCart_"+user.uid)||"null"); if(v){ cart = v.cart||{}; cartForm = {...cartForm, ...(v.cartForm||{})}; } }catch(e){} }
const cartItems = () => MENU.filter(m => cart[m.id] > 0).map(m => ({ id:m.id, name:m.name, price:Number(m.price)||0, qty:cart[m.id] }));
const cartTotal = () => cartItems().reduce((s,i) => s + i.price*i.qty, 0);
const cartQty = () => cartItems().reduce((s,i) => s + i.qty, 0);
const orderClosed = () => { if(S.orderOpen === false) return true; if(S.deadline){ const d = new Date(S.deadline); if(!isNaN(d) && Date.now() > d.getTime()) return true; } return false; };

/* ===================== 인증 흐름 ===================== */
DB.onAuth(async u => {
  unsubs.forEach(f => f()); unsubs = [];
  user = u; profile = null; isAdmin = false; ORDERS = []; LOGS = []; USERS = [];
  if(!u){ render(); return; }
  isAdmin = (u.email === ADMIN_EMAIL);
  try {
    if(isAdmin){
      profile = { name:"관리자" };
      await ensureAdminSeed();
      unsubs.push(DB.listen(C.orders, null, d => { ORDERS = d; render(); }, e => toast(authMsg(e))));
      unsubs.push(DB.listen(C.logs, null, d => { LOGS = d; if(tab==="log") render(); }));
      unsubs.push(DB.listen(C.users, null, d => { USERS = d; }));
      tab = "list";
    } else {
      profile = await DB.get(C.users, u.uid);
      if(!profile){
        // 가입 직후 프로필이 없으면 만들어 둠
        const p = pendingSignup && pendingSignup.email===u.email ? pendingSignup : null;
        profile = { name: p ? p.name : (u.displayName||""), phone: p ? p.phone : digits(u.email.split("@")[0]), createdAt: DB.ts(), lastLoginAt: DB.ts() };
        await DB.set(C.users, u.uid, profile);
        if(p){ await log("signup", "회원가입"); pendingSignup = null; }
      } else {
        DB.update(C.users, u.uid, { lastLoginAt: DB.ts() }).catch(()=>{});
        await log("login", "로그인");
      }
      loadCartLocal();
      unsubs.push(DB.listen(C.orders, {field:"uid",op:"==",value:u.uid}, d => { ORDERS = d; render(); }, e => toast(authMsg(e))));
      tab = "order";
    }
    unsubs.push(DB.listen(C.menu, null, d => { MENU = d.sort((a,b)=>(a.sort||0)-(b.sort||0)); render(); }, e => toast(authMsg(e))));
    unsubs.push(DB.listen(C.meta, null, d => { const s = d.find(x => x.id==="settings"); S = s ? {...DEFAULT_SETTINGS, ...s} : {...DEFAULT_SETTINGS}; render(); }));
  } catch(e){ console.error(e); toast(authMsg(e)); }
  render();
});
async function ensureAdminSeed(){
  const menu = await DB.getAll(C.menu);
  if(menu.length === 0){ for(const m of DEFAULT_MENU){ const {id,...rest} = m; await DB.set(C.menu, id, rest); } }
  const s = await DB.get(C.meta, "settings");
  if(!s) await DB.set(C.meta, "settings", {...DEFAULT_SETTINGS, updatedAt: DB.ts()});
}

async function doSignup(name, phone, pw){
  name = name.trim(); const p = digits(phone);
  if(!name) throw "성명을 입력해 주세요.";
  if(!/^01\d{8,9}$/.test(p)) throw "핸드폰번호를 정확히 입력해 주세요. (예: 010-1234-5678)";
  if(pw.length < 6) throw "비밀번호는 6자리 이상으로 정해 주세요.";
  pendingSignup = { name, phone:p, email: phoneToEmail(p) };
  await DB.signUp(pendingSignup.email, pw, name);
}
async function doLogin(phone, pw){
  const p = digits(phone);
  if(!/^01\d{8,9}$/.test(p)) throw "핸드폰번호를 정확히 입력해 주세요.";
  if(!pw) throw "비밀번호를 입력해 주세요.";
  await DB.signIn(phoneToEmail(p), pw);
}
async function doAdminLogin(id, pw){
  if(id.trim() !== ADMIN_ID) throw "관리자 아이디가 맞지 않습니다.";
  if(!pw) throw "비밀번호를 입력해 주세요.";
  try { await DB.signIn(ADMIN_EMAIL, pw); }
  catch(e){
    const c = e.code||"";
    if(c.includes("user-not-found") || c.includes("invalid-credential") || c.includes("invalid-login")){
      // 최초 1회: 관리자 계정이 아직 없으면 지금 입력한 비밀번호로 생성
      try { await DB.signUp(ADMIN_EMAIL, pw, "관리자"); toast("관리자 계정을 처음 만들었습니다"); }
      catch(e2){ if((e2.code||"").includes("email-already-in-use")) throw "관리자 비밀번호가 맞지 않습니다."; throw e2; }
    } else if(c.includes("wrong-password")) throw "관리자 비밀번호가 맞지 않습니다.";
    else throw e;
  }
  setTimeout(() => log("admin_login", "관리자 로그인"), 500);
}

/* ===================== 렌더 ===================== */
function render(){
  const app = $("#app");
  if(user === undefined) return;
  if(!user){ renderAuth(app); return; }
  if(!profile){ app.innerHTML = `<div class="loading">불러오는 중…</div>`; return; }
  isAdmin ? renderAdmin(app) : renderCustomer(app);
}

function renderAuth(app){
  const m = authMode;
  app.innerHTML = `<div class="auth">
    <div class="logo"><div style="font-size:34px">🌕</div><h1>꽃밥에피다</h1><p>2026 추석 명절음식 예약</p></div>
    <div class="card">
      ${m!=="admin" ? `<div class="seg"><button class="${m==="login"?"on":""}" data-m="login">로그인</button><button class="${m==="signup"?"on":""}" data-m="signup">회원가입</button></div>` : `<h3 style="margin:0 0 6px">관리자 로그인</h3>`}
      <form id="authForm" autocomplete="on">
        ${m==="signup" ? `<label class="f">성명</label><input id="aName" placeholder="주문하시는 분 성함" autocomplete="name">` : ""}
        ${m==="admin" ? `<label class="f">관리자 아이디</label><input id="aId" autocomplete="username">` : `<label class="f">핸드폰번호</label><input id="aPhone" type="tel" inputmode="numeric" placeholder="010-1234-5678" autocomplete="tel">`}
        <label class="f">비밀번호 ${m==="signup" ? "<span style='font-weight:400'>(6자리 이상)</span>" : ""}</label><input id="aPw" type="password" autocomplete="${m==="signup"?"new-password":"current-password"}">
        ${m==="signup" ? `<p class="hint" style="margin:8px 0 0">가입하신 핸드폰번호와 비밀번호로 다시 로그인하실 수 있습니다. 예약 확인을 위해 실제 사용하시는 번호를 입력해 주세요.</p>` : ""}
        <div class="err" id="aErr"></div>
        <button class="main" type="submit" id="aBtn">${m==="signup" ? "가입하고 시작하기" : "로그인"}</button>
      </form>
      <div style="text-align:center;margin-top:12px">
        ${m==="admin" ? `<button class="link" data-m="login">고객 로그인으로 돌아가기</button>` : `<button class="link" data-m="admin" style="color:var(--muted);font-size:13px;text-decoration:none">관리자 로그인</button>`}
      </div>
    </div>
    <p class="hint" style="text-align:center">문의: ${esc(S.phone)}</p>
  </div>`;
  app.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { authMode = b.dataset.m; render(); });
  $("#authForm").onsubmit = async ev => {
    ev.preventDefault(); const btn = $("#aBtn"); btn.disabled = true; $("#aErr").textContent = "";
    try {
      if(m==="signup") await doSignup($("#aName").value, $("#aPhone").value, $("#aPw").value);
      else if(m==="admin") await doAdminLogin($("#aId").value, $("#aPw").value);
      else await doLogin($("#aPhone").value, $("#aPw").value);
    } catch(e){ $("#aErr").textContent = typeof e === "string" ? e : authMsg(e); btn.disabled = false; }
  };
}

/* ---------- 고객 화면 ---------- */
function header(wide){
  return `<header class="top"><div class="in ${wide?"wide":""}">
    <div class="brand"><span style="font-size:22px">🌕</span><div>꽃밥에피다<small>2026 추석 명절음식 예약${isAdmin?" · 관리자":""}</small></div></div>
    <div class="spacer"></div>
    <div class="who"><b>${esc(profile.name||"")}</b>${profile.phone?"<br>"+esc(fmtPhone(profile.phone)):""}</div>
    <button class="ghost sm" id="logoutBtn">로그아웃</button>
  </div></header>`;
}
function bindHeader(){ $("#logoutBtn").onclick = async () => { if(await confirmModal("로그아웃", "로그아웃 하시겠습니까?")) { saveCartLocal(); authMode="login"; await DB.signOut(); } }; }

function renderCustomer(app){
  const tabs = [["order","주문"],["cart","장바구니"],["done","예약완료"]];
  const q = cartQty();
  const active = ORDERS.filter(o => o.status !== "cancelled").length;
  app.innerHTML = header(false) + `<nav class="tabs"><div class="in">${tabs.map(([k,l]) => `<button class="${tab===k?"on":""}" data-t="${k}">${l}${k==="cart"&&q?`<span class="badge">${q}</span>`:""}${k==="done"&&active?`<span class="badge">${active}</span>`:""}</button>`).join("")}</div></nav>
    <div class="wrap" id="body"></div>`;
  bindHeader();
  app.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => { tab = b.dataset.t; render(); window.scrollTo(0,0); });
  const body = $("#body");
  if(tab==="order") renderOrderTab(body);
  else if(tab==="cart") renderCartTab(body);
  else renderDoneTab(body);
}

function renderOrderTab(body){
  const closed = orderClosed();
  body.innerHTML = `
    <div class="notice"><b>꽃밥에피다 2026 추석 명절음식 안내</b>\n${esc(S.notice)}</div>
    ${closed ? `<div class="emph">예약 접수가 마감되었습니다. 문의: ${esc(S.phone)}</div>` : `<div class="emph">${esc(S.limitNote)}</div>`}
    <div class="menu">${MENU.filter(m => m.active !== false).map(m => `<div class="item">
      ${m.image ? `<img class="img" src="${m.image}" alt="">` : `<div class="img"></div>`}
      <div class="body"><div class="name">${esc(m.name)}</div><div class="desc">${esc(m.desc||"")}</div>
        <div class="row between" style="margin-top:auto"><div class="price">${won(m.price)}</div>
          <div class="qty"><button data-d="-1" data-id="${m.id}" ${closed?"disabled":""}>−</button><span id="q_${m.id}">${cart[m.id]||0}</span><button data-d="1" data-id="${m.id}" ${closed?"disabled":""}>+</button></div></div>
        ${cart[m.id]>0 ? `<div class="hint" style="text-align:right">${cart[m.id]}개 = <b>${won(cart[m.id]*m.price)}</b></div>` : ""}
      </div></div>`).join("")}
      ${MENU.length===0 ? `<div class="card hint">등록된 품목이 없습니다.</div>` : ""}
    </div>
    <div class="card"><h3>꽃밥에서 사용하는 재료들</h3><div class="hint" style="white-space:pre-line">${esc(S.materials||"")}</div></div>
    <div class="cartbar"><div class="in"><div class="sum">${won(cartTotal())}<br><small>${cartQty()}개 선택</small></div><div class="spacer"></div><button id="goCart" ${cartQty()?"":"disabled"}>장바구니 보기 →</button></div></div>`;
  body.querySelectorAll(".qty button").forEach(b => b.onclick = () => { const id = b.dataset.id; cart[id] = Math.max(0, (cart[id]||0) + Number(b.dataset.d)); if(!cart[id]) delete cart[id]; saveCartLocal(); render(); });

  const items = cartItems(); const total = cartTotal(); const closed = orderClosed();

  body.innerHTML = `
    <div class="card"><h3>담은 품목</h3>
      ${items.length ? items.map(i => `<div class="cline"><div class="n">${esc(i.name)}<small>${won(i.price)} × ${i.qty}</small></div>

        <div class="p">${won(i.price*i.qty)}</div></div>`).join("") : `<p class="hint">담긴 품목이 없습니다. 주문 탭에서 품목을 담아주세요.</p>`}
      <div class="row between" style="margin-top:10px;padding-top:10px;border-top:2px solid var(--ink)"><span>합계 (${cartQty()}개)</span><span class="sum" style="color:var(--tc)">${won(total)}</span></div>

      <div class="emph">픽업날짜와 시간대를 알려주세요. 가지러 오시는날 만듭니다</div>
      <label class="f">픽업 날짜</label>
      <div class="chips" id="dateChips">${(S.pickupDates||[]).map(d => `<button class="chip ${cartForm.pickupDate===d?"on":""}" data-d="${d}">${fmtPickDate(d)}</button>`).join("")}</div>
      <label class="f">픽업 시간대 (오후 ${S.timeStart}시 ~ ${S.timeEnd}시)</label>

    </div>

      <label class="f">입금자명 (입금하실 때 쓰실 이름)</label>
      <input id="depositor" value="${esc(cartForm.depositor)}" placeholder="예: 홍길동">
      <label class="f">요청사항 (선택)</label>
      <input id="memo" value="${esc(cartForm.memo)}" placeholder="퀵 발송 희망, 기타 요청">
      <div style="margin-top:12px"><button class="ghost" id="acctBtn" style="width:100%;border-color:var(--tc);color:var(--tc)">입금계좌 확인하기</button></div>
    </div>
    ${closed ? `<div class="emph">예약 접수가 마감되었습니다.</div>` : ""}

  body.querySelectorAll("#dateChips .chip").forEach(b => b.onclick = () => { cartForm.pickupDate = b.dataset.d; saveCartLocal(); render(); });
  body.querySelectorAll("#timeChips .chip").forEach(b => b.onclick = () => { cartForm.pickupTime = b.dataset.t; saveCartLocal(); render(); });
  $("#depositor").oninput = e => { cartForm.depositor = e.target.value; saveCartLocal(); };
  $("#memo").oninput = e => { cartForm.memo = e.target.value; saveCartLocal(); };
  $("#acctBtn").onclick = () => accountModal(total, cartForm.depositor.trim());

async function submitOrder(){
  const items = cartItems(); const total = cartTotal();
  if(!items.length) return toast("담긴 품목이 없습니다");

const COLS = [["name","주문자명"],["phone","전화번호"],["itemsText","예약품목"],["qtyTotal","수량"],["total","합계금액"],["pickupDate","픽업날짜"],["pickupTime","픽업시간"],["depositor","입금자명"],["paid","입금여부"],["createdAt","신청일시"],["memo","요청사항"]];
function orderRows(){
  return ORDERS.map(o => ({ ...o, itemsText:(o.items||[]).map(i => `${i.name} ${i.qty}`).join("\n"), createdMs: toDate(o.createdAt)?toDate(o.createdAt).getTime():0, phoneText: fmtPhone(o.phone) }));
}
function filteredRows(){
  let rows = orderRows();
  if(!showCancelled) rows = rows.filter(r => r.status !== "cancelled");
  const q = adminQ.trim().toLowerCase();
  if(q){ rows = rows.filter(r => [r.name, r.phone, r.phoneText, r.itemsText, r.qtyTotal, r.total, fmtPickDate(r.pickupDate), r.pickupDate, r.pickupTime, r.depositor, r.paid?"입금완료 완료 o":"미입금 대기 x", fmtDT(r.createdAt), r.memo, r.status==="cancelled"?"취소":""].join(" ").toLowerCase().includes(q)); }
  const k = adminSort.key, d = adminSort.dir;
  rows.sort((a,b) => { let x = a[k], y = b[k]; if(k==="createdAt"){ x=a.createdMs; y=b.createdMs; } if(k==="paid"){ x = a.paid?1:0; y = b.paid?1:0; } if(typeof x==="number"||typeof y==="number") return ((x||0)-(y||0))*d; return String(x||"").localeCompare(String(y||""),"ko")*d; });
  return rows;
}

function exportExcel(){
  const rows = filteredRows();
  const names = MENU.map(m => m.name);
  const head = ["주문자명","전화번호","예약품목","수량","합계금액","픽업날짜","픽업시간","입금자명","입금여부","상태","신청일시","입금확인일시","요청사항", ...names];
  const data = rows.map(r => [r.name, r.phoneText, r.itemsText.replace(/\n/g,", "), r.qtyTotal||0, r.total||0, fmtPickDate(r.pickupDate), r.pickupTime, r.depositor, r.paid?"입금완료":"미입금", r.status==="cancelled"?"취소":"예약", fmtDT(r.createdAt), fmtDT(r.paidAt), r.memo||"", ...names.map(n => { const it = (r.items||[]).find(i => i.name===n); return it ? it.qty : ""; })]);
  const fname = `추석예약자명단_${new Date().toISOString().slice(0,10).replace(/-/g,"")}`;
  if(window.XLSX){
    const ws = XLSX.utils.aoa_to_sheet([head, ...data]);
    ws["!cols"] = head.map((h,i) => ({ wch: i===2 ? 40 : Math.max(10, h.length*2+2) }));
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "예약자명단");
    XLSX.writeFile(wb, fname + ".xlsx");
  } else {
    const csv = "﻿" + [head, ...data].map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(",")).join("\r\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download = fname + ".csv"; document.body.appendChild(a); a.click(); setTimeout(() => a.remove(), 500);
  }
  log("export", `엑셀 다운로드 ${rows.length}건`);
}

function resizeImage(file, max, q){
  return new Promise((res, rej) => { const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { const r = Math.min(1, max/Math.max(img.width,img.height)); const c = document.createElement("canvas"); c.width = Math.round(img.width*r); c.height = Math.round(img.height*r); c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", q)); };
    img.onerror = rej; img.src = url; });
}

      <label class="f">은행</label><input id="sBank" value="${esc(S.bank)}"><label class="f">계좌번호 (숫자만, 복사 시 이 값만 복사됨)</label><input id="sAcct" value="${esc(S.account)}"><label class="f">예금주</label><input id="sHolder" value="${esc(S.holder)}"></div>
    <div class="card"><h3>예약 접수</h3>
      <label class="row" style="gap:6px"><input type="checkbox" id="sOpen" style="width:18px" ${S.orderOpen!==false?"checked":""}>예약 접수 열림 (끄면 즉시 마감 표시)</label>
      <label class="f">자동 마감 일시</label><input id="sDeadline" type="datetime-local" value="${esc(S.deadline||"")}">
      <label class="f">한정 수량 안내 문구</label><input id="sLimit" value="${esc(S.limitNote)}">
      <label class="f">문의 전화</label><input id="sPhone" value="${esc(S.phone)}"></div>
    <div class="card"><h3>픽업</h3>
      <label class="f">픽업 가능 날짜 (쉼표로 구분, 예: 2026-09-23, 2026-09-24)</label><input id="sDates" value="${esc((S.pickupDates||[]).join(", "))}">
      <div class="row"><div style="flex:1"><label class="f">시작 시(24시간)</label><input id="sStart" type="number" value="${S.timeStart}"></div><div style="flex:1"><label class="f">종료 시(24시간)</label><input id="sEnd" type="number" value="${S.timeEnd}"></div></div></div>
    <div class="card"><h3>안내문 (주문 화면 상단)</h3><textarea id="sNotice" style="min-height:200px">${esc(S.notice)}</textarea>
      <label class="f">꽃밥에서 사용하는 재료들</label><textarea id="sMat">${esc(S.materials||"")}</textarea></div>
    <button id="saveS" style="width:100%;padding:13px">설정 저장</button>
    <div class="card" style="margin-top:20px"><h3>회원 목록</h3><p class="hint">가입한 고객 ${USERS.length}명 (비밀번호를 잊은 고객은 Firebase 콘솔 Authentication에서 해당 번호의 계정을 삭제하면 다시 가입할 수 있습니다.)</p>
      <div class="tblwrap"><table style="min-width:400px"><thead><tr><th>성명</th><th>핸드폰</th><th>가입</th><th>최근 로그인</th></tr></thead><tbody>${[...USERS].sort((a,b)=>(toDate(b.createdAt)||0)-(toDate(a.createdAt)||0)).map(u => `<tr><td>${esc(u.name)}</td><td>${esc(fmtPhone(u.phone))}</td><td>${fmtDT(u.createdAt)}</td><td>${fmtDT(u.lastLoginAt)}</td></tr>`).join("")}</tbody></table></div></div>`;
  $("#saveS").onclick = async () => {
    const data = { bank:$("#sBank").value.trim(), account:digits($("#sAcct").value)||$("#sAcct").value.trim(), holder:$("#sHolder").value.trim(), orderOpen:$("#sOpen").checked, deadline:$("#sDeadline").value, limitNote:$("#sLimit").value.trim(), phone:$("#sPhone").value.trim(),
      pickupDates:$("#sDates").value.split(",").map(s=>s.trim()).filter(Boolean), timeStart:Number($("#sStart").value)||12, timeEnd:Number($("#sEnd").value)||19, notice:$("#sNotice").value, materials:$("#sMat").value, updatedAt:DB.ts() };
    if(data.timeEnd <= data.timeStart) return toast("종료 시는 시작 시보다 커야 합니다");
    try { await DB.set(C.meta, "settings", data, true); await log("settings_save", "설정 저장"); toast("설정이 저장되었습니다"); } catch(e){ toast(authMsg(e)); }
  };
}

const LOG_LABEL = { signup:"회원가입", login:"로그인", admin_login:"관리자", order_create:"예약신청", order_cancel:"예약취소", order_delete:"예약삭제", paid_on:"입금확인", paid_off:"확인해제", menu_save:"품목저장", menu_delete:"품목삭제", settings_save:"설정저장", export:"엑셀" };
function renderAdminLog(body){
  const q = logQ.trim().toLowerCase();
  let list = [...LOGS].sort((a,b) => (toDate(b.at)||0) - (toDate(a.at)||0));
  if(q) list = list.filter(l => [LOG_LABEL[l.type]||l.type, l.name, l.phone, l.detail, fmtDT(l.at)].join(" ").toLowerCase().includes(q));
  body.innerHTML = `<div class="toolbar"><input id="lq" placeholder="기록 검색" value="${esc(logQ)}"><span class="hint">${list.length}건</span></div>
    <div class="card">${list.slice(0,500).map(l => `<div class="log"><span class="t">${fmtDT(l.at)}</span><span class="ty">${esc(LOG_LABEL[l.type]||l.type)}</span><span><b>${esc(l.name||"")}</b> ${esc(fmtPhone(l.phone||""))} ${esc(l.detail||"")}</span></div>`).join("") || `<p class="hint">기록이 없습니다.</p>`}</div>`;
  const i = $("#lq"); i.oninput = () => { logQ = i.value; const p = i.selectionStart; render(); $("#lq").focus(); $("#lq").setSelectionRange(p,p); };
}
</script>
</body>
</html>
