<style>
:root{
  --tc:#b5533c; --tc-dark:#8f3f2d; --tc-light:#fbeee9;
  --ink:#2b2622; --muted:#7a716a; --line:#e8e0d8; --bg:#faf6f1; --card:#fff;
  --ok:#2f8f5b; --ok-light:#e6f4ec; --warn:#b3741f; --warn-light:#fff5e1; --danger:#c43c3c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:15px;line-height:1.5}
button{font-family:inherit;font-size:15px;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:var(--tc);color:#fff;font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500}
button.sm{padding:6px 10px;font-size:13px;border-radius:8px}
button.danger{background:var(--danger)}
button.ok{background:var(--ok)}
input,select,textarea{font-family:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--tc);outline-offset:0;border-color:var(--tc)}
textarea{min-height:90px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:600}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 90px}
.wrap.wide{max-width:1200px}
.topwrap{position:sticky;top:0;z-index:20}
header.top{background:#fff;border-bottom:1px solid var(--line)}
header.top .in{max-width:760px;margin:0 auto;padding:8px 12px;display:flex;align-items:center;gap:8px}
header.top button.sm{line-height:1.2;padding:6px 8px;white-space:nowrap}
.mobile-who{display:none}
@media(max-width:480px){.mobile-who{display:block}header.top .who{display:none}header.top .brand small{display:none}header.top .brand img{width:30px!important;height:30px!important}}
header.top .in.wide{max-width:1200px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--tc);white-space:nowrap}
.brand small{display:block;font-size:12px;color:var(--muted);font-weight:500;line-height:1.2}
.spacer{flex:1}
.who{font-size:13px;color:var(--muted);text-align:right;line-height:1.25}
.who b{color:var(--ink)}
nav.tabs{background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.04)}
nav.tabs .in{max-width:760px;margin:0 auto;display:flex}
nav.tabs .in.wide{max-width:1200px}
nav.tabs button{flex:1;background:none;color:var(--muted);border-radius:0;padding:12px 4px;font-weight:600;border-bottom:3px solid transparent;position:relative}
nav.tabs button.on{color:var(--tc);border-bottom-color:var(--tc)}
nav.tabs button .badge{display:inline-block;vertical-align:top;margin-left:4px;background:var(--tc);color:#fff;font-size:11px;border-radius:10px;padding:0 6px;line-height:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.card h3{margin:0 0 8px;font-size:16px}
.notice{background:var(--tc-light);border:1px solid #f0cfc4;border-radius:14px;padding:12px 14px;margin:12px 0;font-size:14px;white-space:pre-line}
.notice b{color:var(--tc-dark)}
.hint{font-size:13px;color:var(--muted)}
.emph{background:var(--warn-light);border:1px solid #f1dcb0;color:#7a4e0c;border-radius:10px;padding:10px 12px;font-weight:600;font-size:14px;margin:8px 0}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
@media(max-width:480px){.item .body{padding:10px}.item .name{font-size:14px}.item .desc{font-size:11px;line-height:1.35}.item .price{font-size:15px}.item .body .row{flex-direction:column;align-items:flex-start;gap:6px}.item .qty{width:100%;justify-content:space-between}.item .qty button{padding:8px 0;flex:1}.item .qty span{flex:1}}
.item{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.item .img{width:100%;aspect-ratio:4/3;background:#f1ebe4 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120' viewBox='0 0 120 120'><circle cx='60' cy='60' r='40' fill='%23e7dcd2'/><text x='60' y='66' font-size='14' text-anchor='middle' fill='%23a3958a' font-family='sans-serif'>사진 준비중</text></svg>") center/120px no-repeat;object-fit:cover;display:block}
.item .body{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.item .name{font-weight:700;font-size:16px}
.item .desc{font-size:13px;color:var(--muted);white-space:pre-line}
.item .price{font-weight:700;color:var(--tc);font-size:17px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qty button{background:#fff;color:var(--ink);border-radius:0;padding:8px 14px;font-size:18px;font-weight:700;min-width:44px}
.qty button:active{background:var(--tc-light)}
.qty span{min-width:40px;text-align:center;font-weight:700;font-size:16px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.sum{font-weight:700;font-size:18px}
.sum small{font-weight:500;color:var(--muted);font-size:13px}
.cartbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:18;box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.cartbar .in{max-width:760px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:12px}
.cline{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.cline:last-child{border-bottom:0}
.cline .n{flex:1}
.cline .n small{display:block;color:var(--muted);font-size:12px}
.cline .p{font-weight:700;min-width:80px;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:600}
.chip.on{background:var(--tc);color:#fff;border-color:var(--tc)}
.acct{background:#fff;border:2px dashed var(--tc);border-radius:12px;padding:12px;text-align:center;margin:10px 0}
.acct .num{font-size:22px;font-weight:800;letter-spacing:1px;color:var(--tc-dark);margin:4px 0}
.status-ok{background:var(--ok-light);color:var(--ok);border-radius:12px;padding:14px;text-align:center;font-weight:800;font-size:18px}
.status-wait{background:var(--warn-light);color:#7a4e0c;border-radius:12px;padding:14px;text-align:center;font-weight:800;font-size:17px}
.status-claim{background:#e8f0fb;color:#2b5aa6;border-radius:12px;padding:14px;text-align:center;font-weight:800;font-size:17px}
.bigmsg{background:var(--tc);color:#fff;border-radius:12px;padding:12px 14px;text-align:center;font-weight:800;font-size:17px;margin:10px 0;letter-spacing:.2px}
.paidbox{display:flex;align-items:center;gap:10px;border:2px solid var(--tc);border-radius:12px;padding:12px;margin-top:10px;background:#fff;cursor:pointer;font-weight:700;font-size:16px}
.paidbox input{width:24px;height:24px;flex:none}
.status-cancel{background:#eee;color:#666;border-radius:12px;padding:12px;text-align:center;font-weight:700}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-light);color:var(--ok)}
.pill.wait{background:var(--warn-light);color:#7a4e0c}
.pill.cancel{background:#eee;color:#777}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:420px;box-shadow:0 20px 50px rgba(0,0,0,.25);max-height:90vh;overflow:auto}
.modal h3{margin:0 0 10px;font-size:18px;color:var(--tc-dark)}
.modal .btns{display:flex;gap:8px;margin-top:14px}
.modal .btns button{flex:1}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#2b2622;color:#fff;padding:10px 18px;border-radius:999px;z-index:60;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.auth{max-width:420px;margin:30px auto;padding:0 14px}
.auth .logo{text-align:center;margin-bottom:14px}
.auth .logo h1{margin:6px 0 0;font-size:22px;color:var(--tc)}
.auth .logo p{margin:2px 0 0;color:var(--muted);font-size:14px}
.auth .card{padding:20px}
.auth button.main{width:100%;padding:13px;font-size:16px;margin-top:14px}
.link{background:none;color:var(--tc);padding:4px;font-weight:600;text-decoration:underline}
.err{color:var(--danger);font-size:13px;margin-top:8px;min-height:18px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:6px}
.seg button{flex:1;background:#fff;color:var(--muted);border-radius:0;padding:10px}
.seg button.on{background:var(--tc);color:#fff}
/* admin */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.toolbar input{max-width:320px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px}
.stat b{font-size:16px;color:var(--tc-dark);margin-left:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font-size:26px;font-weight:800;color:var(--ink);margin-top:2px;letter-spacing:-.5px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.main{background:var(--tc);border-color:var(--tc)}
.kpi.main .l,.kpi.main .v,.kpi.main .s{color:#fff}
.kpi.ok .v{color:var(--ok)} .kpi.wait .v{color:#b3741f} .kpi.claim .v{color:#2b5aa6}
.bar{height:10px;background:#eee;border-radius:5px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok)}
.tblwrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:900px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
th{background:#f6f1eb;position:sticky;top:0;cursor:pointer;user-select:none;font-weight:700}
th .arr{color:var(--tc);margin-left:4px}
td.items{white-space:pre-line;min-width:180px}
tr.cancelled td{color:#999;text-decoration:line-through}
tr.cancelled td.nol{text-decoration:none}
td .chk{width:20px;height:20px;cursor:pointer}
tr.paid td{background:#f4fbf6}
.adm-item{display:grid;grid-template-columns:120px 1fr;gap:12px}
.adm-item img,.adm-item .noimg{width:120px;height:90px;object-fit:cover;border-radius:10px;background:#f1ebe4;display:block}
.adm-item .noimg{display:flex;align-items:center;justify-content:center;color:#aaa;font-size:12px}
@media(max-width:600px){.adm-item{grid-template-columns:1fr}}
.log{font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);display:flex;gap:8px}
.log .t{color:var(--muted);min-width:118px}
.log .ty{font-weight:700;min-width:70px}
.loading{text-align:center;color:var(--muted);padding:60px 0}
</style>

/* ===================== 데이터 계층 (Firebase / 데모) ===================== */
const DEMO = (location.protocol === "file:" || location.search.includes("demo=1"));
let DB;
if (!DEMO) {
  const app = firebase.initializeApp(FIREBASE_CONFIG, APP_NAME);
  const auth = firebase.auth(app);
  const fs = firebase.firestore(app);
  const conv = d => ({ id:d.id, ...d.data() });
  DB = {
    onAuth: cb => auth.onAuthStateChanged(u => cb(u ? { uid:u.uid, email:u.email, displayName:u.displayName } : null)),
    signUp: async (email,pw,name) => { const r = await auth.createUserWithEmailAndPassword(email,pw); if(name) await r.user.updateProfile({displayName:name}); return { uid:r.user.uid, email }; },
    signIn: async (email,pw) => { const r = await auth.signInWithEmailAndPassword(email,pw); return { uid:r.user.uid, email }; },
    signOut: () => auth.signOut(),
    updatePassword: pw => auth.currentUser.updatePassword(pw),
    // 관리자 세션을 유지한 채 다른 계정을 만들기 위해 별도 앱 인스턴스를 사용
    adminCreateUser: async (email,pw,name) => { const app2 = firebase.apps.find(a => a.name==="chuseokWorker") || firebase.initializeApp(FIREBASE_CONFIG, "chuseokWorker"); const a2 = firebase.auth(app2); const r = await a2.createUserWithEmailAndPassword(email,pw); if(name) await r.user.updateProfile({displayName:name}); const uid = r.user.uid; await a2.signOut(); return uid; },
    ts: () => firebase.firestore.FieldValue.serverTimestamp(),
    get: async (col,id) => { const d = await fs.collection(col).doc(id).get(); return d.exists ? conv(d) : null; },
    set: (col,id,data,merge) => fs.collection(col).doc(id).set(data,{merge:!!merge}),
    update: (col,id,data) => fs.collection(col).doc(id).update(data),
    del: (col,id) => fs.collection(col).doc(id).delete(),
    add: async (col,data) => (await fs.collection(col).add(data)).id,
    getAll: async (col,filter) => { let q = fs.collection(col); if(filter) q = q.where(filter.field,filter.op,filter.value); const s = await q.get(); return s.docs.map(conv); },
    listen: (col,filter,cb,err) => { let q = fs.collection(col); if(filter) q = q.where(filter.field,filter.op,filter.value); return q.onSnapshot(s => cb(s.docs.map(conv)), e => { console.error(e); err && err(e); }); }
  };
} else {
  // 데모 모드: 브라우저 메모리에만 저장 (file://로 열었을 때)
  const store = {}; const users = {}; let cur = null; const authCbs = []; const listeners = [];
  const col = c => (store[c] = store[c] || {});
  const fire = c => listeners.filter(l => l.col===c).forEach(l => l.cb(match(c,l.filter)));
  const match = (c,f) => Object.entries(col(c)).map(([id,d]) => ({id,...clone(d)})).filter(d => !f || d[f.field]===f.value);
  const clone = o => JSON.parse(JSON.stringify(o), (k,v) => (v && v.__ts) ? new Date(v.__ts) : v);
  const emitAuth = () => authCbs.forEach(cb => cb(cur));
  DB = {
    onAuth: cb => { authCbs.push(cb); setTimeout(() => cb(cur), 0); },
    signUp: async (email,pw,name) => { if(users[email]) throw {code:"auth/email-already-in-use"}; if(pw.length<6) throw {code:"auth/weak-password"}; users[email] = {pw, uid:"u_"+Math.random().toString(36).slice(2,9), displayName:name}; cur = {uid:users[email].uid,email,displayName:name}; emitAuth(); return cur; },
    signIn: async (email,pw) => { const u = users[email]; if(!u) throw {code:"auth/user-not-found"}; if(u.pw!==pw) throw {code:"auth/wrong-password"}; cur = {uid:u.uid,email,displayName:u.displayName}; emitAuth(); return cur; },
    signOut: async () => { cur = null; emitAuth(); },
    updatePassword: async pw => { users[cur.email].pw = pw; },
    adminCreateUser: async (email,pw,name) => { if(users[email]) throw {code:"auth/email-already-in-use"}; users[email] = {pw, uid:"u_"+Math.random().toString(36).slice(2,9), displayName:name}; return users[email].uid; },
    ts: () => ({__ts: Date.now()}),
    get: async (c,id) => col(c)[id] ? {id,...clone(col(c)[id])} : null,
    set: async (c,id,data,merge) => { col(c)[id] = merge ? {...(col(c)[id]||{}),...clone(data)} : clone(data); fire(c); },
    update: async (c,id,data) => { if(!col(c)[id]) throw new Error("no doc"); Object.assign(col(c)[id], clone(data)); fire(c); },
    del: async (c,id) => { delete col(c)[id]; fire(c); },
    add: async (c,data) => { const id = "d_"+Math.random().toString(36).slice(2,10); col(c)[id] = clone(data); fire(c); return id; },
    getAll: async (c,f) => match(c,f),
    listen: (c,f,cb) => { const l = {col:c,filter:f,cb}; listeners.push(l); setTimeout(() => cb(match(c,f)),0); return () => { const i = listeners.indexOf(l); if(i>=0) listeners.splice(i,1); }; }
  };
  window.__DEMO_DB = { store, users };
}

async function doSignup(name, phone, pw){
  name = name.trim(); const p = digits(phone);
  if(!name) throw "성명을 입력해 주세요.";
  if(!/^01\d{8,9}$/.test(p)) throw "핸드폰번호를 정확히 입력해 주세요. (예: 010-1234-5678)";
  if(pw.length < 6) throw "비밀번호는 6자리 이상으로 정해 주세요.";
  const info = await loginInfo(p);
  pendingSignup = { name, phone:p, email: phoneToEmail(p, info.v) };
  try { await DB.signUp(pendingSignup.email, pw, name); }
  catch(e){
    if((e.code||"").includes("email-already-in-use")){
      // 이미 입력했던 분: 같은 비밀번호면 그대로 들어가기
      pendingSignup = null;
      try { await DB.signIn(phoneToEmail(p, info.v), pw); }
      catch(e2){
        if(info.resetAt && pw !== TEMP_PW) throw `이 번호는 ${fmtDT(info.resetAt)}에 비밀번호가 임시 비밀번호 ${TEMP_PW}으로 초기화되었습니다. ${TEMP_PW}으로 들어와 주세요.`;
        if(info.createdByAdminAt && pw !== TEMP_PW) throw `이 번호는 매장에서 전화 예약 시 만들어 드린 계정입니다. 임시 비밀번호 ${TEMP_PW}으로 들어와 주세요.`;
        throw "이미 입력하셨던 번호입니다. 그때 정하신 비밀번호를 입력해 주세요. 잊으셨다면 아래 '비밀번호를 잊으셨나요?'를 눌러 주세요.";
      }
    } else throw e;
  }
}
async function doLogin(phone, pw){
  const p = digits(phone);
  if(!/^01\d{8,9}$/.test(p)) throw "핸드폰번호를 정확히 입력해 주세요.";
  if(!pw) throw "비밀번호를 입력해 주세요.";
  const info = await loginInfo(p);
  try { await DB.signIn(phoneToEmail(p, info.v), pw); }
  catch(e){
    const c = e.code||"";
    const bad = c.includes("wrong-password")||c.includes("invalid-credential")||c.includes("invalid-login")||c.includes("user-not-found");
    if(info.resetAt && pw !== TEMP_PW && bad)
      throw `이 번호는 ${fmtDT(info.resetAt)}에 비밀번호가 임시 비밀번호 ${TEMP_PW}으로 초기화되었습니다. ${TEMP_PW}으로 로그인해 주세요.`;
    if(info.createdByAdminAt && pw !== TEMP_PW && bad)
      throw `이 번호는 매장에서 전화 예약 시 만들어 드린 계정입니다. 임시 비밀번호 ${TEMP_PW}으로 로그인한 뒤 비밀번호를 바꿔 주세요.`;
    throw e;
  }
}
async function requestReset(name, phone){

  if(!name) throw "성명을 입력해 주세요.";
  if(!/^01\d{8,9}$/.test(p)) throw "핸드폰번호를 정확히 입력해 주세요.";
  await DB.set(C.resets, p, { name, phone:p, status:"requested", requestedAt: DB.ts() });
}
async function changeMyPassword(pw){
  if(pw.length < 6) throw "비밀번호는 6자리 이상으로 정해 주세요.";
  if(pw === TEMP_PW) throw "임시 비밀번호와 다른 비밀번호로 정해 주세요.";
  await DB.updatePassword(pw);
  await DB.update(C.users, user.uid, { tempPassword:false, pwChangedAt:DB.ts() });
  profile.tempPassword = false;
  await log("pw_change", "비밀번호 변경");
}
async function doAdminLogin(id, pw){
  if(id.trim() !== ADMIN_ID) throw "관리자 아이디가 맞지 않습니다.";
  if(!pw) throw "비밀번호를 입력해 주세요.";
  try { await DB.signIn(ADMIN_EMAIL, pw); }
  catch(e){
    const c = e.code||"";
    if(c.includes("user-not-found") || c.includes("invalid-credential") || c.includes("invalid-login")){
      // 최초 1회: 관리자 계정이 아직 없으면 지금 입력한 비밀번호로 생성
      try { await DB.signUp(ADMIN_EMAIL, pw, "관리자"); toast("관리자 계정을 처음 만들었습니다"); }
      catch(e2){ if((e2.code||"").includes("email-already-in-use")) throw "관리자 비밀번호가 맞지 않습니다."; throw e2; }
    } else if(c.includes("wrong-password")) throw "관리자 비밀번호가 맞지 않습니다.";
    else throw e;
  }
  setTimeout(() => log("admin_login", "관리자 로그인"), 500);
}

function drawOrderCard(o){

  y += 110;

  x.strokeStyle = "#2b2622"; x.beginPath(); x.moveTo(pad, y-16); x.lineTo(W-pad, y-16); x.stroke(); y += 16;
  const row = (k,v,big) => { x.fillStyle = "#7a716a"; x.font = font(22,false); x.fillText(k, pad, y); x.fillStyle = big ? "#b5533c" : "#2b2622"; x.font = font(big?28:24,true); x.textAlign = "right"; x.fillText(v, W-pad, y); x.textAlign = "left"; y += 46; };

function summaryData(){
  const names = MENU.map(m => m.name);
  const dates = [...(S.pickupDates||[])]; const slots = timeSlots(S);
  const active = ORDERS.filter(o => o.status !== "cancelled");
  const q = (pred, n) => active.filter(pred).reduce((s,o) => s + ((o.items||[]).find(i => i.name===n)||{qty:0}).qty, 0);
  const byItem = names.map(n => ({ name:n, dates: dates.map(d => q(o => o.pickupDate === d, n)), undated: q(o => !dates.includes(o.pickupDate), n), total: q(()=>true, n), paid: q(o => o.paid, n), claimed: q(o => !o.paid && o.customerPaid, n), unpaid: q(o => !o.paid && !o.customerPaid, n) }));
  const totalRow = { name:"합계", dates: dates.map((_,i) => byItem.reduce((s,r) => s + r.dates[i], 0)), undated: byItem.reduce((s,r)=>s+r.undated,0), total: byItem.reduce((s,r)=>s+r.total,0), paid: byItem.reduce((s,r)=>s+r.paid,0), claimed: byItem.reduce((s,r)=>s+r.claimed,0), unpaid: byItem.reduce((s,r)=>s+r.unpaid,0) };
  // 날짜 × 시간대 × 품목
  const byTime = [];
  dates.forEach(d => { slots.forEach(t => { const rows = active.filter(o => o.pickupDate === d && o.pickupTime === t); if(!rows.length) return; byTime.push({ date:d, time:t, orders: rows.length, items: names.map(n => rows.reduce((s,o) => s + ((o.items||[]).find(i => i.name===n)||{qty:0}).qty, 0)) }); });
    const other = active.filter(o => o.pickupDate === d && !slots.includes(o.pickupTime)); if(other.length) byTime.push({ date:d, time:"미정", orders: other.length, items: names.map(n => other.reduce((s,o) => s + ((o.items||[]).find(i => i.name===n)||{qty:0}).qty, 0)) }); });
  const und = active.filter(o => !dates.includes(o.pickupDate)); if(und.length) byTime.push({ date:"", time:"미정", orders: und.length, items: names.map(n => und.reduce((s,o) => s + ((o.items||[]).find(i => i.name===n)||{qty:0}).qty, 0)) });
  const dateTotals = dates.map(d => { const rows = active.filter(o => o.pickupDate === d); return { date:d, orders: rows.length, items: names.map(n => rows.reduce((s,o) => s + ((o.items||[]).find(i => i.name===n)||{qty:0}).qty, 0)) }; });
  const amt = arr => arr.reduce((s,o) => s + (o.total||0), 0);
  const paidO = active.filter(o => o.paid), claimO = active.filter(o => !o.paid && o.customerPaid), waitO = active.filter(o => !o.paid && !o.customerPaid);
  const priceOf = n => { const m = MENU.find(x => x.name === n); return Number(m && m.price) || 0; };
  const itemRevenue = names.map(n => { const rev = active.reduce((s,o) => s + ((o.items||[]).find(i => i.name===n)||{qty:0,price:0}).qty * (((o.items||[]).find(i => i.name===n)||{}).price || priceOf(n)), 0); const paidRev = paidO.reduce((s,o) => s + ((o.items||[]).find(i => i.name===n)||{qty:0,price:0}).qty * (((o.items||[]).find(i => i.name===n)||{}).price || priceOf(n)), 0); return { name:n, price:priceOf(n), qty: q(()=>true, n), rev, paidRev }; });
  const dateRevenue = dates.map(d => { const rows = active.filter(o => o.pickupDate === d); return { date:d, orders: rows.length, qty: rows.reduce((s,o)=>s+(o.qtyTotal||0),0), rev: amt(rows), paidRev: amt(rows.filter(o=>o.paid)) }; });
  const undRows = active.filter(o => !dates.includes(o.pickupDate)); if(undRows.length) dateRevenue.push({ date:"", orders: undRows.length, qty: undRows.reduce((s,o)=>s+(o.qtyTotal||0),0), rev: amt(undRows), paidRev: amt(undRows.filter(o=>o.paid)) });
  const money = { total: amt(active), paid: amt(paidO), claim: amt(claimO), wait: amt(waitO), orders: active.length, paidOrders: paidO.length, claimOrders: claimO.length, waitOrders: waitO.length, qty: active.reduce((s,o)=>s+(o.qtyTotal||0),0), cancelled: ORDERS.length - active.length, members: USERS.filter(u=>!u.replacedBy).length };
  return { names, dates, byItem, totalRow, byTime, dateTotals, itemRevenue, dateRevenue, money, activeCount: active.length, paidCount: paidO.length };
}
function pickupOrderedList(){
  const dates = [...(S.pickupDates||[])]; const slots = timeSlots(S);
  const active = ORDERS.filter(o => o.status !== "cancelled");
  const key = o => { const di = dates.indexOf(o.pickupDate); const ti = slots.indexOf(o.pickupTime); return [di < 0 ? 99 : di, ti < 0 ? 99 : ti]; };
  const sorted = [...active].sort((a,b) => { const ka = key(a), kb = key(b); return (ka[0]-kb[0]) || (ka[1]-kb[1]) || String(a.name).localeCompare(String(b.name),"ko"); });
  const groups = [];
  sorted.forEach(o => { const d = dates.includes(o.pickupDate) ? o.pickupDate : ""; const t = slots.includes(o.pickupTime) ? o.pickupTime : "미정"; let g = groups[groups.length-1]; if(!g || g.date !== d || g.time !== t){ g = { date:d, time:t, orders:[] }; groups.push(g); } g.orders.push(o); });
  return groups;
}

// 압축 없이(store) zip 만들기
const CRC_TABLE = (() => { const t = new Uint32Array(256); for(let i = 0; i < 256; i++){ let c = i; for(let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[i] = c >>> 0; } return t; })();
function crc32(u8){ let c = 0xFFFFFFFF; for(let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipStore(files){
  const enc = new TextEncoder(); const parts = []; const central = []; let offset = 0;
  const u16 = v => [v & 0xFF, (v >>> 8) & 0xFF]; const u32 = v => [v & 0xFF, (v >>> 8) & 0xFF, (v >>> 16) & 0xFF, (v >>> 24) & 0xFF];
  const dt = new Date(); const dosTime = ((dt.getHours() << 11) | (dt.getMinutes() << 5) | (dt.getSeconds() >> 1)) & 0xFFFF; const dosDate = (((dt.getFullYear() - 1980) << 9) | ((dt.getMonth() + 1) << 5) | dt.getDate()) & 0xFFFF;
  for(const [name, content] of Object.entries(files)){
    const nameB = enc.encode(name); const data = enc.encode(content); const crc = crc32(data);
    const local = new Uint8Array([0x50,0x4B,0x03,0x04, ...u16(20), ...u16(0x0800), ...u16(0), ...u16(dosTime), ...u16(dosDate), ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(nameB.length), ...u16(0), ...nameB]);
    parts.push(local, data);
    central.push(new Uint8Array([0x50,0x4B,0x01,0x02, ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(dosTime), ...u16(dosDate), ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(nameB.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(offset), ...nameB]));
    offset += local.length + data.length;
  }
  const cdSize = central.reduce((s,c) => s + c.length, 0);
  const end = new Uint8Array([0x50,0x4B,0x05,0x06, ...u16(0), ...u16(0), ...u16(central.length), ...u16(central.length), ...u32(cdSize), ...u32(offset), ...u16(0)]);
  const all = [...parts, ...central, end]; const total = all.reduce((s,c) => s + c.length, 0);
  const out = new Uint8Array(total); let pos = 0; for(const c of all){ out.set(c, pos); pos += c.length; }
  return out;
}

function resizeImage(file, max, q){
  return new Promise((res, rej) => { const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { const r = Math.min(1, max/Math.max(img.width,img.height)); const c = document.createElement("canvas"); c.width = Math.round(img.width*r); c.height = Math.round(img.height*r); c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", q)); };
    img.onerror = rej; img.src = url; });
}

        if(paid && !o.paid) data.paidAt = DB.ts(); if(!paid) data.paidAt = null;
        await DB.update(C.orders, o.id, data);
        await log("order_edit", `예약 수정 ${name}(${fmtPhone(phone)}) ${won(data.total)} / ${items.map(i => i.name+"×"+i.qty).join(", ")} / 픽업 ${fmtPickDate(data.pickupDate)} ${data.pickupTime} / 입금 ${paid?"확인":"미확인"} (${o.id})`);
        toast("저장되었습니다");
      }
      closeModal();
    } catch(e){ $("#fErr").textContent = authMsg(e); }
  };
}
async function adminCreateCustomer(phone, name, silent){
  const p = digits(phone); name = (name||"").trim();
  if(!/^01\d{8,9}$/.test(p)) { toast("핸드폰번호가 있어야 계정을 만들 수 있습니다"); return null; }
  const existing = USERS.find(u => u.phone === p && !u.replacedBy);
  if(existing){ const orders = await DB.getAll(C.orders, {field:"phone",op:"==",value:p}); let n = 0; for(const o of orders) if(o.uid !== existing.id){ await DB.update(C.orders, o.id, { uid: existing.id }); n++; } if(!silent) toast(n ? `이미 가입된 번호입니다. 예약 ${n}건을 그 계정에 연결했습니다` : "이미 가입된 번호입니다 (예약도 이미 연결됨)"); return existing.id; }
  if(!silent && !(await confirmModal("고객 계정 만들기", `<b>${esc(name)}</b> (${esc(fmtPhone(p))}) 님의 계정을 임시 비밀번호 <b>${TEMP_PW}</b>으로 만들고, 이 번호의 예약을 모두 연결합니다.<br><span class="hint">고객에게 "링크 접속 → 핸드폰번호 + ${TEMP_PW}으로 로그인"이라고 알려 주세요. 로그인하면 비밀번호를 바꾸라는 안내가 뜹니다.</span>`, "만들기"))) return null;
  try {
    const info = await loginInfo(p);
    let v = Number(info.v)||1, uid;
    try { uid = await DB.adminCreateUser(phoneToEmail(p, v), TEMP_PW, name); }
    catch(e){ if((e.code||"").includes("email-already-in-use")){ v += 1; uid = await DB.adminCreateUser(phoneToEmail(p, v), TEMP_PW, name); } else throw e; }
    await DB.set(C.users, uid, { name, phone:p, createdAt:DB.ts(), lastLoginAt:null, tempPassword:true, createdBy:"admin" });
    await DB.set(C.login, p, { v, createdByAdminAt:DB.ts() }, true);
    const orders = await DB.getAll(C.orders, {field:"phone",op:"==",value:p});
    for(const o of orders) await DB.update(C.orders, o.id, { uid });
    await log("account_create", `${name}(${fmtPhone(p)}) 고객 계정 생성(임시 비밀번호), 예약 ${orders.length}건 연결`);
    toast(`${name}님 계정을 만들었습니다 (비밀번호 ${TEMP_PW})`);
    return uid;
  } catch(e){ toast(authMsg(e)); return null; }
}
async function adminDeleteUser(uid){
  const u = USERS.find(x => x.id === uid); if(!u) return;
  const myOrders = ORDERS.filter(o => o.uid === uid);
  const ok = await new Promise(res => {
    openModal(`<h3>회원 삭제</h3><p><b>${esc(u.name)}</b> (${esc(fmtPhone(u.phone))}) 님의 회원 정보를 삭제하시겠습니까?</p>
      <p class="hint">삭제하면 이 번호는 다시 회원가입할 수 있고, 기존 비밀번호로는 로그인되지 않습니다.</p>
      ${myOrders.length ? `<label class="row" style="gap:6px"><input type="checkbox" id="delOrders" style="width:18px">이 회원의 예약 ${myOrders.length}건도 함께 삭제 <span class="hint">(체크하지 않으면 예약은 명단에 남습니다)</span></label>` : `<p class="hint">이 회원의 예약은 없습니다.</p>`}
      <div class="btns"><button class="ghost" id="mCancel">취소</button><button class="danger" id="mOk">삭제</button></div>`);
    $("#mCancel").onclick = () => { closeModal(); res(false); };
    $("#mOk").onclick = () => { const d = $("#delOrders") && $("#delOrders").checked; closeModal(); res({ delOrders: d }); };
  });
  if(!ok) return;
  try {
    if(ok.delOrders) for(const o of myOrders) await DB.del(C.orders, o.id);
    await DB.del(C.users, uid);
    for(const x of USERS.filter(x => x.replacedBy === uid || x.prevUid === uid)) await DB.del(C.users, x.id).catch(()=>{});
    if(u.phone){ const info = await loginInfo(u.phone); await DB.set(C.login, u.phone, { v:(Number(info.v)||1)+1, deletedAt:DB.ts(), resetAt:null, createdByAdminAt:null }, true); }
    const req = RESETS.find(r => r.phone === u.phone); if(req) await DB.del(C.resets, req.id).catch(()=>{});
    await log("user_delete", `회원 삭제 ${u.name}(${fmtPhone(u.phone)})${ok.delOrders ? `, 예약 ${myOrders.length}건 삭제` : ""}`);
    toast("회원 정보를 삭제했습니다");
  } catch(e){ toast(authMsg(e)); }
}
async function adminResetPassword(phone, name){
  const p = digits(phone);
  const old = USERS.filter(u => u.phone === p && !u.replacedBy);
  const ok = await confirmModal("비밀번호 초기화", `<b>${esc(name||"")}</b> (${esc(fmtPhone(p))}) 님의 비밀번호를 <b>${TEMP_PW}</b>으로 초기화하시겠습니까?<br><span class="hint">기존 예약과 기록은 그대로 유지됩니다. 고객에게 ${TEMP_PW}으로 로그인하라고 알려 주세요.</span>`, "초기화");
  if(!ok) return;
  try {
    const info = await loginInfo(p);
    const v = (Number(info.v)||1) + 1;
    const email = phoneToEmail(p, v);
    const newUid = await DB.adminCreateUser(email, TEMP_PW, name || (old[0] && old[0].name) || "");
    const prof = { name: (old[0] && old[0].name) || name || "", phone:p, createdAt:(old[0] && old[0].createdAt) || DB.ts(), lastLoginAt:null, tempPassword:true, resetAt:DB.ts(), prevUid:(old[0] && old[0].id) || null };
    await DB.set(C.users, newUid, prof);
    for(const u of old) await DB.update(C.users, u.id, { replacedBy:newUid });
    // 같은 번호의 기존 예약을 새 계정으로 연결
    const orders = await DB.getAll(C.orders, {field:"phone",op:"==",value:p});
    for(const o of orders) await DB.update(C.orders, o.id, { uid:newUid });
    await DB.set(C.login, p, { v, resetAt:DB.ts() }, true);
    const req = RESETS.find(r => r.phone === p);
    if(req) await DB.update(C.resets, req.id, { status:"done", doneAt:DB.ts() });
    await log("pw_reset", `${prof.name}(${fmtPhone(p)}) 비밀번호 초기화, 예약 ${orders.length}건 연결`);
    toast(`${prof.name}님 비밀번호를 ${TEMP_PW}으로 초기화했습니다`);
    render();
  } catch(e){ toast(authMsg(e)); }
}
const LOG_LABEL = { signup:"회원가입", pw_reset:"비번초기화", pw_change:"비번변경", order_phone:"전화예약", order_edit:"예약수정", account_create:"계정생성", pickup_change:"픽업변경", user_delete:"회원삭제", customer_paid:"고객입금표시", customer_paid_off:"입금표시해제", order_merge:"추가합산", order_restore:"예약복구", login:"로그인", admin_login:"관리자", order_create:"예약신청", order_cancel:"예약취소", order_delete:"예약삭제", paid_on:"입금확인", paid_off:"확인해제", menu_save:"품목저장", menu_delete:"품목삭제", settings_save:"설정저장", export:"엑셀" };
function renderAdminLog(body){
  const q = logQ.trim().toLowerCase();
  let list = [...LOGS].sort((a,b) => (toDate(b.at)||0) - (toDate(a.at)||0));
  if(q) list = list.filter(l => [LOG_LABEL[l.type]||l.type, l.name, l.phone, l.detail, fmtDT(l.at)].join(" ").toLowerCase().includes(q));
  if(!$("#lq")){ body.innerHTML = `<div class="toolbar"><input id="lq" placeholder="검색" value="${esc(logQ)}"><span class="hint" id="logCount"></span></div><div class="card" id="logArea"></div>`; const i = $("#lq"); i.oninput = () => { logQ = i.value; renderAdminLog(body); }; }
  $("#logCount").textContent = list.length + "건";
  $("#logArea").innerHTML = list.slice(0,500).map(l => `<div class="log"><span class="t">${fmtDT(l.at)}</span><span class="ty">${esc(LOG_LABEL[l.type]||l.type)}</span><span><b>${esc(l.name||"")}</b> ${esc(fmtPhone(l.phone||""))} ${esc(l.detail||"")}</span></div>`).join("") || `<p class="hint">기록이 없습니다.</p>`;
}
